# Web frontend configuration.
# PORT is set by most hosting platforms (Render, Railway, Koyeb, ...).
# Falls back to 8080 locally.
server.port=${PORT:8080}
spring.application.name=airline-booking-system

# SQLite database location. Point airline.dbUrl at a mounted volume in
# production to keep data across restarts, e.g.
#   airline.dbUrl=jdbc:sqlite:/var/data/airline.db
airline.dbUrl=jdbc:sqlite:data/airline.db

# Keep Spring from pre-loading templates so edits show up immediately.
spring.thymeleaf.cache=false

# SQLite is file-based and single-writer; let the DAO layer manage it.
spring.jpa.open-in-view=false
