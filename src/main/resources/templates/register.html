<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register · Airline Booking System</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div class="auth-wrap">
    <div class="auth-card">
        <h1>Create an account</h1>
        <p class="subtitle">Register as a passenger</p>

        <div class="alert alert-error" th:if="${error}" th:text="${error}">err</div>

        <form method="post" th:action="@{/register}">
            <div class="field">
                <label for="name">Full name</label>
                <input type="text" id="name" name="name" th:value="${name}" required>
            </div>
            <div class="field">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" th:value="${email}" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="field">
                <label for="phone">Phone (optional)</label>
                <input type="text" id="phone" name="phone" th:value="${phone}">
            </div>
            <button class="btn btn-block" type="submit">Register</button>
        </form>

        <p class="subtitle" style="margin-top:18px; text-align:center;">
            Already registered? <a th:href="@{/login}">Sign in</a>
        </p>
    </div>
</div>
</body>
</html>
